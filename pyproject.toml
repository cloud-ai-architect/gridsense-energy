[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridsense-energy"
version = "0.1.0"
description = "Real-time energy grid optimization agent. Demand forecasting, anomaly detection, demand-response orchestration."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
  "boto3>=1.35.0",
  "langgraph>=0.1.0",
  "pydantic>=2.8.0",
  "structlog>=24.4.0",
  "PyYAML>=6.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.5",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests assert; that is what they are for.
# ARG001: pytest fixtures are passed by name and often unused in the body.
# PLC0415: imports inside a test keep an optional dependency scoped to it.
"tests/**" = ["S101", "ARG001", "PLC0415"]

# Lambda handlers take (event, context) to satisfy the runtime contract even
# when context is unused, and import boto3 lazily to keep cold starts short.
"src/lambdas/**" = ["ARG001", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# boto3 and botocore ship no type information. Their call sites are typed on
# our side; this only stops mypy reporting the library itself.
module = ["boto3.*", "botocore.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--cov=src", "--cov-fail-under=25"]
testpaths = ["tests"]
asyncio_mode = "auto"
